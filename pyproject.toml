[tool.poetry]
name = "tryrb-api"
version = "1.0.0"
description = "Authenticated CPU background-removal API for tryRB"
authors = ["tryRB contributors"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
rembg = { version = ">=2.0.66,<3.0.0", extras = ["cpu"] }
fastapi = ">=0.115,<1.0"
uvicorn = { version = ">=0.30,<1.0", extras = ["standard"] }
python-multipart = ">=0.0.9,<0.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

name: tryRB checks

on:
  push:
    branches:
      - main
      - feature/tryrb-web-app-v1
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend and test dependencies
        run: |
          python -m pip install -r requirements-backend.txt
          python -m pip install pytest httpx

      - name: Check Python syntax and imports
        env:
          TRYRB_API_TOKEN: ci-test-token-value-not-used-outside-ci-123456789
          ALLOWED_ORIGINS: https://dickv940-star.github.io
        run: |
          python -m compileall -q server.py tests
          python -c "import server; assert server.app.title.startswith('tryRB')"

      - name: Run API security and validation tests
        env:
          TRYRB_API_TOKEN: ci-test-token-value-not-used-outside-ci-123456789
          ALLOWED_ORIGINS: https://dickv940-star.github.io
        run: pytest -q

      - name: Check frontend JavaScript syntax
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          match = re.search(r'<script type="module">(.*?)</script>', html, re.S)
          if not match:
              raise SystemExit("Module script not found")
          Path("/tmp/tryrb-frontend.mjs").write_text(match.group(1), encoding="utf-8")
          PY
          node --check /tmp/tryrb-frontend.mjs

      - name: Build backend Docker image
        run: docker build -t tryrb-api:ci .
